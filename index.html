
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo | Mi primera web</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      background:
        radial-gradient(circle at 20% 20%, #263b80 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, #651d80 0%, transparent 40%),
        #090d1c;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 50px 30px;
      max-width: 700px;
      animation: aparecer 1.2s ease;
    }

    .tag {
      display: inline-block;
      padding: 9px 18px;
      border: 1px solid #6366f1;
      border-radius: 30px;
      color: #a5b4fc;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(48px, 10vw, 90px);
      font-weight: 800;
      background: linear-gradient(
        90deg, #60a5fa, #c084fc, #f0abfc
      );
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 20px;
    }

    p {
      font-size: 19px;
      color: #cbd5e1;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    button {
      padding: 15px 32px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      box-shadow: 0 8px 30px #6366f155;
      transition: .3s;
    }

    button:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px #a855f788;
    }

    #mensaje {
      margin-top: 25px;
      color: #c4b5fd;
      font-size: 17px;
    }

    footer {
      position: fixed;
      bottom: 25px;
      color: #64748b;
      font-size: 13px;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <div class="tag">✦ MI PRIMER PROYECTO EN GITHUB</div>

    <h1>¡Hola Mundo!</h1>

    <p>
      Bienvenido a mi primera página web.<br>
      Hoy comienza algo increíble. 🚀
    </p>

    <button onclick="saludar()">
      Haz clic aquí ✨
    </button>

    <div id="mensaje"></div>
  </main>

  <footer>
    Hecho con ❤️ y publicado en GitHub Pages
  </footer>

  <script>
    function saludar() {
      document.getElementById("mensaje").textContent =
        "🎉 ¡Lo lograste! Tu primera web está funcionando.";
    }
  </script>

</body>
</html>
